<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighting Fantasy — Dungeon Prototype</title>
<style>
  :root{
    --bg:#11100e; --panel:#1b1916; --panel2:#24211d; --line:#4a4338;
    --text:#eee8dc; --muted:#bdb3a3; --accent:#c8a96b; --danger:#a44;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:#0b0b0a; color:var(--text);
    font-family: Georgia, "Times New Roman", serif;
    min-height:100vh; display:flex; justify-content:center;
  }
  .game{
    width:min(1500px,100vw); min-height:100vh; display:flex; flex-direction:column;
    background:#12110f;
  }
  header{
    height:72px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; border-bottom:1px solid var(--line); background:#171512;
  }
  header h1{font-size:23px; letter-spacing:2px; margin:0; text-transform:uppercase}
  .status{color:var(--muted); font-size:14px}
  main{flex:1; display:grid; grid-template-columns:minmax(0, 2.15fr) minmax(330px, .95fr); min-height:0}
  .visual{
    position:relative; min-height:calc(100vh - 72px); background:#080807;
    border-right:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #scene{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:contrast(1.02);
  }
  .compass{
    position:absolute; top:18px; left:18px; width:92px; height:92px;
    border:2px solid #d5c9b6; border-radius:50%; background:rgba(12,11,10,.78);
    box-shadow:0 5px 20px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
  }
  .compass .ring{position:absolute; inset:7px; border:1px solid #817767; border-radius:50%}
  .compass .north{position:absolute; top:6px; font-weight:bold; font-size:13px}
  .compass .south{position:absolute; bottom:6px; font-size:12px}
  .compass .east{position:absolute; right:8px; font-size:12px}
  .compass .west{position:absolute; left:8px; font-size:12px}
  .needle{
    position:absolute; width:3px; height:55px; background:#d6b86f;
    transform-origin:50% 78%; border-radius:2px;
  }
  .needle:after{content:""; position:absolute; top:-3px; left:-4px; border-left:5px solid transparent;
    border-right:5px solid transparent; border-bottom:11px solid #d6b86f}
  .join{
    position:absolute; min-width:44px; height:38px; padding:0 10px; border:1px solid #d7c8af;
    background:rgba(20,18,15,.82); color:#eee8dc; border-radius:6px; font-size:20px;
    cursor:pointer; display:none; align-items:center; justify-content:center;
  }
  .join:hover{background:rgba(50,45,38,.95)}
  .join.up{top:17%; left:50%; transform:translateX(-50%)}
  .join.down{bottom:17%; left:50%; transform:translateX(-50%)}
  .join.left{left:4%; top:50%; transform:translateY(-50%)}
  .join.right{right:4%; top:50%; transform:translateY(-50%)}
  .hint{
    position:absolute; bottom:16px; left:18px; right:18px; text-align:center;
    color:#e5ddcf; font-size:14px; background:rgba(8,8,7,.72); padding:8px 10px; border-radius:5px;
  }
  .side{background:var(--panel); display:flex; flex-direction:column; min-height:0}
  .story{padding:18px 22px 12px; overflow:auto; flex:1}
  .map-card{border:1px solid var(--line); background:#15130f; border-radius:7px; padding:10px; margin-bottom:18px}
  .map-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px}
  .map-head span{font-size:12px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted)}
  .map-head b{font-size:12px; color:var(--accent); font-weight:normal}
  #dungeonMap{width:100%; height:auto; display:block; background:#d8cfbd; border-radius:4px}
  .map-room{fill:#25211b; stroke:#6b604e; stroke-width:2}
  .map-corridor{stroke:#6b604e; stroke-width:10; stroke-linecap:round}
  .map-label{font-family:Georgia,serif; font-size:12px; fill:#eee8dc; text-anchor:middle}
  .map-note{font-family:Georgia,serif; font-size:9px; fill:#3d372f; text-anchor:middle}
  .map-player{fill:#c8a96b; stroke:#171512; stroke-width:2}
  .map-lock{stroke:#a44; stroke-width:3; stroke-linecap:round}
  .map-item{fill:#eee8dc; stroke:#171512; stroke-width:1.5}
  .map-route{stroke:#8f805f; stroke-width:2; stroke-dasharray:4 4; fill:none; opacity:.8}
  .location{color:var(--accent); font-size:13px; letter-spacing:1.5px; text-transform:uppercase}
  .story h2{margin:7px 0 16px; font-size:28px}
  .story p{font-size:17px; line-height:1.6; color:#e4ddcf}
  .log{margin-top:18px; border-top:1px solid var(--line); padding-top:13px}
  .log div{padding:6px 0; color:var(--muted); font-size:14px}
  .actions{padding:15px 18px 18px; border-top:1px solid var(--line); background:var(--panel2)}
  .actions h3{font-size:13px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin:0 0 10px}
  .buttons{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  button{
    font:inherit; color:var(--text); background:#302c26; border:1px solid #615747;
    border-radius:5px; padding:11px 9px; cursor:pointer;
  }
  button:hover:not(:disabled){background:#403a31; border-color:#8a7758}
  button:disabled{opacity:.35; cursor:not-allowed}
  .keys{margin-top:12px; color:#bfb5a5; font-size:13px; line-height:1.5}
  .keys b{color:#e5d9c5}
  @media(max-width:850px){
    main{grid-template-columns:1fr}
    .visual{min-height:55vh; border-right:0; border-bottom:1px solid var(--line)}
    .side{min-height:45vh}
  }
</style>
</head>
<body>
<div class="game">
  <header>
    <h1>Fighting Fantasy: The Dungeon</h1>
    <div class="status" id="status">Prototype 01 • Exploration</div>
  </header>
  <main>
    <section class="visual">
      <img id="scene" alt="Dungeon scene">
      <div class="compass" aria-label="Compass">
        <div class="ring"></div><div class="north">N</div><div class="south">S</div>
        <div class="east">E</div><div class="west">W</div><div class="needle" id="needle"></div>
      </div>
      <button class="join up" id="joinUp">↑</button>
      <button class="join down" id="joinDown">↓</button>
      <button class="join left" id="joinLeft">←</button>
      <button class="join right" id="joinRight">→</button>
      <div class="hint">W move forward • S move backward • A turn left • D turn right</div>
    </section>
    <aside class="side">
      <div class="story">
        <div class="map-card">
        <div class="map-head"><span>Dungeon Map</span><b id="mapFacing">Facing N</b></div>
        <svg id="dungeonMap" viewBox="0 0 360 245" aria-label="Dungeon map">
          <line class="map-corridor" x1="75" y1="195" x2="75" y2="145"/>
          <line class="map-corridor" x1="75" y1="145" x2="150" y2="145"/>
          <line class="map-corridor" x1="150" y1="145" x2="150" y2="95"/>
          <line class="map-corridor" x1="150" y1="95" x2="225" y2="95"/>
          <line class="map-corridor" x1="225" y1="95" x2="225" y2="45"/>
          <line class="map-corridor" x1="225" y1="45" x2="300" y2="45"/>
          <line class="map-corridor" x1="225" y1="95" x2="150" y2="45"/>
          <line class="map-corridor" x1="225" y1="45" x2="225" y2="195"/>
          <line class="map-corridor" x1="225" y1="195" x2="225" y2="225"/>
          <path class="map-route" d="M75 195 L75 145 L150 145 L150 95 L225 95 L225 45 L300 45"/>
          <rect id="map-room1" class="map-room" x="35" y="175" width="80" height="40" rx="5"/>
          <rect id="map-room2" class="map-room" x="110" y="125" width="80" height="40" rx="5"/>
          <rect id="map-room3" class="map-room" x="185" y="25" width="80" height="40" rx="5"/>
          <rect id="map-room4" class="map-room" x="185" y="175" width="80" height="40" rx="5"/>
          <rect class="map-room" x="125" y="75" width="50" height="40" rx="5"/>
          <rect class="map-room" x="275" y="25" width="70" height="40" rx="5"/>
          <rect class="map-room" x="190" y="215" width="70" height="22" rx="5"/>
          <text class="map-note" x="75" y="199">ROOM 1</text>
          <text class="map-note" x="150" y="149">ROOM 2</text>
          <text class="map-note" x="225" y="49">ROOM 3</text>
          <text class="map-note" x="225" y="199">ROOM 4</text>
          <text class="map-note" x="150" y="99">JUNCTION</text>
          <text class="map-note" x="310" y="49">FREEDOM</text>
          <text class="map-note" x="225" y="230">ESCAPE</text>
          <text id="map-key" class="map-label" x="95" y="112">🔑</text>
          <text id="map-sword" class="map-label" x="275" y="155">⚔</text>
          <text id="map-snake" class="map-label" x="225" y="160">🐍</text>
          <line class="map-lock" x1="185" y1="45" x2="185" y2="65"/>
          <circle id="map-player" class="map-player" cx="75" cy="195" r="7"/>
        </svg>
      </div>
      <div class="location" id="location">Room 1</div>
        <h2 id="title">The Cell</h2>
        <div id="description"></div>
        <div class="log" id="log"></div>
      </div>
      <div class="actions">
        <h3>Actions</h3>
        <div class="buttons">
          <button id="examine">Examine</button>
          <button id="open">Open / Enter</button>
          <button id="take">Take</button>
          <button id="inventory">Inventory</button>
        </div>
        <div class="keys"><b>Keyboard:</b> W/S move • A/D turn 90°</div>
      </div>
    </aside>
  </main>
</div>

<script>
const scenes = {
  room1: "Gloomy Medieval Dungeon Cell.png",
  corridor: "Corridor .png",
  key: "Key.png",
  warrior: "Sheild and sword.png",
  snake: "Snake .png",
  room2: "room.png"
};

const nodes = {
  room1: {name:"Room 1", title:"The Cell", image:"room1", desc:"You awaken in a cold stone cell. A heavy wooden door is the only obvious way out.", exits:{N:"room2"}},
  room2: {name:"Room 2", title:"The Passage", image:"corridoor", desc:"A narrow stone passage stretches before you. The dungeon is silent, but you sense that the way out will not be simple.", exits:{S:"room1", N:"junction", W:"key"}},
  key: {name:"Key Passage", title:"Something on the Floor", image:"key", desc:"A small iron key lies on the cracked stone floor. It may fit one of the dungeon's locked doors.", exits:{E:"room2"}, item:"key"},
  junction: {name:"Junction", title:"Four Ways", image:"corridor", desc:"The passage opens into a junction. A locked door lies to the east. The northern route continues deeper into the dungeon.", exits:{S:"room2", N:"room3", W:"key"}},
  room3: {name:"Room 3", title:"The Locked Chamber", image:"room2", desc:"The chamber is darker here. A heavy door blocks the way ahead. Your key may be the answer.", exits:{S:"junction", E:"room4"}, locked:true},
  room4: {name:"Room 4", title:"The Fallen Warrior", image:"warrior", desc:"A dead warrior lies against the wall. His sword rests beside him. Beyond him is a passage leading towards freedom.", exits:{W:"room3", S:"snake"}, item:"sword"},
  snake: {name:"Snake Passage", title:"The Serpent", image:"snake", desc:"A large snake blocks the passage. It watches you carefully. You will need the sword to get past it.", exits:{N:"room4", S:"freedom"}, blocked:true},
  freedom: {name:"Freedom", title:"Freedom", image:"corridor", desc:"You have escaped the dungeon. This is the end of Prototype 01.", exits:{N:"snake"}, victory:true}
};

let state = {
  node:"room1",
  facing:"N",
  inventory:[],
  collected:{key:false, sword:false},
  log:["You wake to the sound of distant water dripping."]
};

const directions = ["N","E","S","W"];
const arrows = {N:"↑",E:"→",S:"↓",W:"←"};

function sceneForNode(node){
  if(node==="key" && state.collected.key) return scenes.corridor;
  if(node==="room4" && state.collected.sword) return scenes.corridor;
  if(node==="snake" && state.collected.sword) return scenes.corridor;
  return scenes[nodes[node].image];
}

function directionIndex(d){return directions.indexOf(d)}
function turn(delta){
  const i=(directionIndex(state.facing)+delta+4)%4;
  state.facing=directions[i];
  addLog(`You turn ${delta>0 ? "clockwise" : "anticlockwise"}. You are facing ${state.facing}.`);
  render();
}

function opposite(d){return directions[(directionIndex(d)+2)%4]}

function move(delta){
  const d = delta===1 ? state.facing : opposite(state.facing);
  const node = nodes[state.node];
  let target = node.exits[d];
  if(!target){
    addLog("There is no passage in that direction.");
    render(); return;
  }
  if(target==="room3" && !state.collected.key){
    addLog("The door is locked. You need a key.");
    render(); return;
  }
  if(target==="freedom" && !state.collected.sword){
    addLog("The snake blocks your path. You need a weapon.");
    render(); return;
  }
  state.node=target;
  addLog(`You move ${d}.`);
  render();
}

function addLog(text){
  state.log.unshift(text);
  state.log=state.log.slice(0,5);
}

function render(){
  const n=nodes[state.node];
  document.getElementById("scene").src=sceneForNode(state.node);
  document.getElementById("location").textContent=n.name;
  document.getElementById("title").textContent=n.title;
  document.getElementById("description").innerHTML = `<p>${n.desc}</p>`;
  document.getElementById("log").innerHTML=state.log.map(x=>`<div>${x}</div>`).join("");

  const needle=document.getElementById("needle");
  const angles={N:0,E:90,S:180,W:270};
  needle.style.transform=`rotate(${angles[state.facing]}deg)`;

  ["up","down","left","right"].forEach(k=>document.getElementById("join"+k[0].toUpperCase()+k.slice(1)).style.display="none");
  const visible = [];
  const map = {N:"up",S:"down",E:"right",W:"left"};
  for(const d of directions){
    if(n.exits[d]) visible.push(map[d]);
  }
  visible.forEach(k=>document.getElementById("join"+k[0].toUpperCase()+k.slice(1)).style.display="flex");

  document.getElementById("mapFacing").textContent = `Facing ${state.facing}`;
  const mapPositions = {
    room1:[75,195], room2:[150,145], key:[95,112], junction:[150,95], room3:[225,45], room4:[225,195], snake:[225,160], freedom:[310,45]
  };
  const pos = mapPositions[state.node] || mapPositions.room1;
  document.getElementById("map-player").setAttribute("cx",pos[0]);
  document.getElementById("map-player").setAttribute("cy",pos[1]);
  document.getElementById("map-key").style.opacity = state.collected.key ? "0.2" : "1";
  document.getElementById("map-sword").style.opacity = state.collected.sword ? "0.2" : "1";
  document.getElementById("map-snake").style.opacity = state.collected.sword ? "0.25" : "1";
  document.getElementById("take").disabled = !((state.node==="key"&&!state.collected.key)||(state.node==="room4"&&!state.collected.sword));
  document.getElementById("open").disabled = !(state.node==="room3" || state.node==="snake" || state.node==="room1");
  document.getElementById("status").textContent = `Prototype 01 • Facing ${state.facing} • ${state.inventory.length ? "Inventory: "+state.inventory.join(", ") : "Inventory: empty"}`;
}

function examine(){
  const n=nodes[state.node];
  if(state.node==="key" && !state.collected.key) addLog("It is a small iron key, cold to the touch.");
  else if(state.node==="room4" && !state.collected.sword) addLog("The sword looks old, but the blade appears sound.");
  else if(state.node==="snake" && !state.collected.sword) addLog("The snake is large, alert and very much alive.");
  else addLog(n.desc);
  render();
}

function take(){
  if(state.node==="key" && !state.collected.key){
    state.collected.key=true; state.inventory.push("Iron key"); addLog("You pick up the iron key."); 
  } else if(state.node==="room4" && !state.collected.sword){
    state.collected.sword=true; state.inventory.push("Sword"); addLog("You take the sword. It feels reassuringly solid.");
  }
  render();
}

function openEnter(){
  if(state.node==="room1"){ move(1); return; }
  if(state.node==="room3"){
    if(state.collected.key){ addLog("The iron key turns. The locked door opens."); move(1); return; }
    addLog("The door is firmly locked.");
  } else if(state.node==="snake"){
    if(state.collected.sword){ addLog("You raise the sword. The snake retreats."); move(1); return; }
    addLog("You cannot pass the snake safely.");
  } else addLog("There is nothing here to open.");
  render();
}

function showInventory(){
  addLog(state.inventory.length ? `You carry: ${state.inventory.join(", ")}.` : "Your inventory is empty.");
  render();
}

document.addEventListener("keydown", e=>{
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  const k=e.key.toLowerCase();
  if(k==="w") move(1);
  else if(k==="s") move(-1);
  else if(k==="a") turn(-1);
  else if(k==="d") turn(1);
  else if(k==="e") examine();
  else if(k==="i") showInventory();
});

document.getElementById("examine").onclick=examine;
document.getElementById("take").onclick=take;
document.getElementById("open").onclick=openEnter;
document.getElementById("inventory").onclick=showInventory;

const joinFns = {Up:()=>move(1),Down:()=>move(-1),Left:()=>turn(-1),Right:()=>turn(1)};
Object.keys(joinFns).forEach(k=>document.getElementById("join"+k).onclick=joinFns[k]);

render();
</script>
</body>
</html>
