<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Combat Prototype</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #181818;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #timer {
      font-size: 24px;
      margin: 20px;
    }

    #combatArea {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 10px auto 20px;
    }

    #attackTarget {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Invisible scoring track across the lower chest, at 82% image height. */
    #combatBar {
      position: absolute;
      left: 0;
      top: 82%;
      width: 100%;
      height: 0;
      pointer-events: none;
    }

    #sword {
      position: absolute;
      width: 126.75px;
      height: auto;
      left: 0;
      bottom: 18%;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }

    #attackButton {
      margin-top: 20px;

      font-size: 26px;
      font-weight: bold;

      padding: 15px 45px;

      cursor: pointer;
    }

    #result {
      font-size: 32px;
      font-weight: bold;

      min-height: 45px;
      margin-top: 25px;
    }

    #instructions {
      margin-top: 20px;
      color: #cccccc;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>Combat Prototype</h1>

  <div id="timer">
    Time: <span id="time">10.0</span>
  </div>

  <div id="combatArea">

    <img id="attackTarget" src="attack-target.png" alt="Armour target: grey outer arms, brown chest and red centre" width="1122" height="1402">

    <img
      id="sword"
      src="sword.png"
      alt="Sword"
    >

    <div id="combatBar" aria-hidden="true"></div>

  </div>

  <button id="attackButton">
    ATTACK
  </button>

  <div id="result"></div>

  <div id="instructions">
    Stop the sword tip on the red chest strip for a Critical Hit. Brown armour: Partial Blow. Grey outer armour: Miss.
  </div>

<script>

const sword =
  document.getElementById("sword");

const bar =
  document.getElementById("combatBar");

const attackButton =
  document.getElementById("attackButton");

const result =
  document.getElementById("result");

const timeDisplay =
  document.getElementById("time");


let position = 0;

let direction = 1;

let running = true;

let lastTime =
  performance.now();

let turnTime = 10;


/*
  Sword takes 1.5 seconds
  to travel from one side
  of the bar to the other.
*/

const travelTime = 1500;


function animate(currentTime) {

  const delta =
    currentTime - lastTime;

  lastTime =
    currentTime;


  if (running) {

    const barWidth =
      bar.clientWidth;


    const speed =
      barWidth / travelTime;


    position +=
      speed *
      delta *
      direction;


    if (position >= barWidth) {

      position =
        barWidth;

      direction =
        -1;

    }


    if (position <= 0) {

      position =
        0;

      direction =
        1;

    }


    /*
      The horizontal position represents
      the EXACT position of the sword tip.
    */

    sword.style.left =
  (bar.offsetLeft + position) + "px";


    turnTime -=
      delta / 1000;


    if (turnTime <= 0) {

      turnTime = 0;

      running = false;

      result.textContent =
        "TURN LOST - DEFEND!";

      attackButton.textContent =
        "TRY AGAIN";

    }


    timeDisplay.textContent =
      turnTime.toFixed(1);

  }


  requestAnimationFrame(
    animate
  );

}


attackButton.addEventListener(
  "click",
  function () {

    if (!running) {

      resetTurn();

      return;

    }


    running = false;

    checkResult();


    attackButton.textContent =
      "TRY AGAIN";

  }
);


function checkResult() {

  // Artwork boundaries at the sword-tip line (82% down the image):
  // grey | brown | red chest strip | brown | grey.
  // Percentages are relative to the complete responsive target width.

  const barWidth =
    bar.clientWidth;


  const percentage =
    (position / barWidth) * 100;


  if (percentage < 19.5) {

    result.textContent =
      "MISS";

  }

  else if (percentage < 43.7) {

    result.textContent =
      "PARTIAL BLOW";

  }

  else if (percentage < 53.8) {

    result.textContent =
      "CRITICAL HIT!";

  }

  else if (percentage < 78) {

    result.textContent =
      "PARTIAL BLOW";

  }

  else {

    result.textContent =
      "MISS";

  }

}


function resetTurn() {

  position = 0;

  sword.style.left = bar.offsetLeft + "px";
  timeDisplay.textContent = "10.0";

  direction = 1;

  turnTime = 10;

  running = true;

  result.textContent = "";

  attackButton.textContent =
    "ATTACK";

  lastTime =
    performance.now();

}


// Preserve the exact relative tip position when the responsive target resizes.
let previousTrackWidth = bar.clientWidth;
window.addEventListener("resize", function () {
  const width = bar.clientWidth;
  if (previousTrackWidth > 0) position = position / previousTrackWidth * width;
  previousTrackWidth = width;
  sword.style.left = (bar.offsetLeft + position) + "px";
});

requestAnimationFrame(
  animate
);

</script>

</body>
</html>
